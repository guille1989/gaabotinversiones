# Activar después de emitir el certificado para bot.theinnoapp.com.
server {
    listen 80;
    server_name bot.theinnoapp.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }
    location / {
        return 301 https://bot.theinnoapp.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bot.theinnoapp.com;
    ssl_certificate /etc/letsencrypt/live/bot.theinnoapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.theinnoapp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    auth_basic "GaaInversiones - acceso privado";
    auth_basic_user_file /etc/nginx/gaainversiones.htpasswd;
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
